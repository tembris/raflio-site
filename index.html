<style>
:root{--bg:#EDEAE3;--fg:#0B0B0B;--dim:#5b5a57;--line:#D6D0C4;--accent:#a8322f;--code:rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0E0E10;--fg:#F5F4F2;--dim:#A9A9AF;--line:#2E2E33;--accent:#DD5E5E;--code:rgba(255,255,255,.08)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 ui-serif,Georgia,"Times New Roman",serif}
main{max-width:46rem;margin:0 auto;padding:2.5rem 1rem 5rem}
header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;border-bottom:1px solid var(--line);padding-bottom:1rem;margin-bottom:2rem}
.brand{font-size:1.5rem;color:var(--accent);text-decoration:none;letter-spacing:.01em}
.lang{color:var(--dim);font:14px system-ui,sans-serif}
h1{font-size:1.9rem;line-height:1.25;margin:0 0 1.5rem}
h2{font-size:1.3rem;margin:2.4rem 0 .8rem}
h3{font-size:1.08rem;margin:1.8rem 0 .5rem}
p,li{margin:.6rem 0}
ul,ol{padding-left:1.4rem}
hr{border:0;border-top:1px solid var(--line);margin:2.2rem 0}
code{font:.88em ui-monospace,Menlo,Consolas,monospace;background:var(--code);padding:.1em .35em;border-radius:4px;word-break:break-word}
blockquote{margin:1.2rem 0;padding:.2rem 1rem;border-left:3px solid var(--accent);color:var(--fg)}
.table{overflow-x:auto;margin:1rem 0}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border:1px solid var(--line);padding:.5rem .6rem;text-align:left;vertical-align:top}
th{font-weight:600}
footer{margin-top:3rem;color:var(--dim);font:14px system-ui,sans-serif}
a{color:var(--accent)}
</style>
</head>
<body>

<header><a class="brand" href="./">Raflio</a></header>
